connection = "my_connection"
role = "MY_INSTALLER_ROLE"
warehouse = "MY_WAREHOUSE"
database = "MY_DATABASE"
schema = "OVERTURE_SEMANTIC"
viewer_role = "MY_VIEWER_ROLE"
# Optional. The DCM project object lives in project_schema, and S3-loaded data
# in raw_schema; defaults are <schema>_DCM and <schema>_RAW. All three differ.
# project_schema = "OVERTURE_SEMANTIC_DCM"
# raw_schema = "OVERTURE_SEMANTIC_RAW"
# Optional, default true. Set register_cowork = false where the installer must not
# change the account's CoWork agent list; set grant_shared_objects = false when the
# viewer already has database and warehouse USAGE or the installer cannot grant it.
# register_cowork = true
# grant_shared_objects = true

[source]
mode = "existing"
release = "unknown"
coverage = "Global; verify coverage and release with the source provider."
place = "OVERTURE_MAPS__PLACES.CARTO.PLACE"
division = "OVERTURE_MAPS__DIVISIONS.CARTO.DIVISION"
division_area = "OVERTURE_MAPS__DIVISIONS.CARTO.DIVISION_AREA"
division_boundary = "OVERTURE_MAPS__DIVISIONS.CARTO.DIVISION_BOUNDARY"
# Opt-in large themes: any of "address", "segment", "building". Each needs a
# source below in existing mode; S3 mode loads them clipped to place_bbox.
optional_themes = []
address = "OVERTURE_MAPS__ADDRESSES.CARTO.ADDRESS"
segment = "OVERTURE_MAPS__TRANSPORTATION.CARTO.SEGMENT"
building = "OVERTURE_MAPS__BUILDINGS.CARTO.BUILDING"

[s3]
release = "latest"
storage_integration = ""
place_bbox = [-122.52, 37.70, -122.35, 37.83]

[limits]
statement_timeout_seconds = 1800
map_rows = 1000